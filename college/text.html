<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">


    <script>
        // The carousel will work automatically with Bootstrap JS loaded
        // No need for manual initialization unless you need custom behavior
        document.addEventListener('DOMContentLoaded', function () {
            // If you need custom behavior, you can access the carousel like this:
            const myCarousel = document.getElementById('recruitersCarousel');
            const carousel = new bootstrap.Carousel(myCarousel, {
                interval: 3000,
                ride: 'carousel'
            });

            // Optional: Add event listeners if needed
            myCarousel.addEventListener('slide.bs.carousel', function (event) {
                console.log('Sliding from', event.from, 'to', event.to);
            });
        });
    </script>

</head>



<body>



    <section id="recruiters" class="section recruiters-section">
        <h2 class="section-title">Our Recruiters</h2>
        <p class="section-subtitle">A legacy of excellence in education and innovation</p>
        <div class="about-container">
            <div class="about-content">
                <div id="recruitersCarousel" class="carousel slide" data-bs-ride="carousel">
                    <!-- Indicators -->
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#recruitersCarousel" data-bs-slide-to="0"
                            class="active"></button>
                        <button type="button" data-bs-target="#recruitersCarousel" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#recruitersCarousel" data-bs-slide-to="2"></button>
                        <button type="button" data-bs-target="#recruitersCarousel" data-bs-slide-to="3"></button>
                        <button type="button" data-bs-target="#recruitersCarousel" data-bs-slide-to="4"></button>
                    </div>

                    <!-- Slides -->
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="../images/bank.PNG" class="d-block w-100" alt="Bank"
                                style="height: 350px; object-fit: contain;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/fincial.PNG" class="d-block w-100" alt="Financial"
                                style="height: 350px; object-fit: contain;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/hcl.PNG" class="d-block w-100" alt="HCL"
                                style="height: 350px; object-fit: contain;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/hdfc.PNG" class="d-block w-100" alt="HDFC"
                                style="height: 350px; object-fit: contain;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/patra.PNG" class="d-block w-100" alt="Patra"
                                style="height: 350px; object-fit: contain;">
                        </div>
                    </div>

                    <!-- Controls -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#recruitersCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#recruitersCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
